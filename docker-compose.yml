services:
  # =========================================================================
  # PLANKA APPLICATION (LOCAL BUILD)
  # =========================================================================
  planka:
    #image: ghcr.io/plankanban/planka:latest
    build: .
    container_name: planka
    restart: unless-stopped

    # Load environment from .env file
    env_file:
      - .env

    # Expose port
    ports:
      - "${PLANKA_PORT:-3000}:1337"

    # Volumes for persistent data
    volumes:
      - planka_data:/app/data

    # Environment variables
    environment:
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TRUST_PROXY=${TRUST_PROXY:-false}

    # Resource limits (ТРЕБОВАНИЕ)
    deploy:
      resources:
        limits:
          cpus: '${PLANKA_CPU_LIMIT:-1}'
          memory: ${PLANKA_MEMORY_LIMIT:-1G}
        reservations:
          cpus: '${PLANKA_CPU_RESERVATION:-0.5}'
          memory: ${PLANKA_MEMORY_RESERVATION:-512M}

    # Health check (ТРЕБОВАНИЕ)
    healthcheck:
      test: ["CMD", "node", "./healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Dependencies
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - planka-network


  # =========================================================================
  # POSTGRESQL DATABASE
  # =========================================================================
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: planka-postgres
    restart: unless-stopped

    # Load environment from .env
    env_file:
      - .env

    # Volumes for persistent database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:                          # ← ДОБАВИТЬ
      - "5432:5432"
    # Environment variables
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-planka}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_INITDB_ARGS=${POSTGRES_INITDB_ARGS:--c shared_buffers=256MB -c max_connections=200}

    # Resource limits (ТРЕБОВАНИЕ)
    deploy:
      resources:
        limits:
          cpus: '${POSTGRES_CPU_LIMIT:-0.5}'
          memory: ${POSTGRES_MEMORY_LIMIT:-512M}
        reservations:
          cpus: '${POSTGRES_CPU_RESERVATION:-0.25}'
          memory: ${POSTGRES_MEMORY_RESERVATION:-256M}

    # Health check (ТРЕБОВАНИЕ)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-planka}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - planka-network


  # =========================================================================
  # REDIS CACHE
  # =========================================================================
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: planka-redis
    restart: unless-stopped

    # Command with configuration from environment
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis-password}

    # Volumes for persistence
    volumes:
      - redis_data:/data

    # Resource limits (ТРЕБОВАНИЕ)
    deploy:
      resources:
        limits:
          cpus: '${REDIS_CPU_LIMIT:-0.25}'
          memory: ${REDIS_MEMORY_LIMIT:-256M}
        reservations:
          cpus: '${REDIS_CPU_RESERVATION:-0.1}'
          memory: ${REDIS_MEMORY_RESERVATION:-128M}

    # Health check (ТРЕБОВАНИЕ)
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

    networks:
      - planka-network

# =========================================================================
# NETWORKS
# =========================================================================
networks:
  planka-network:
    driver: bridge
