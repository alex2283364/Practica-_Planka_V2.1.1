name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Шаг 1: Запуск setup.sh (развертывание)
      - name: Run setup.sh
        run: |
          chmod +x setup.sh
          ./setup.sh

      # Шаг 2: Запуск smoke_test.sh
      - name: Run smoke tests
        run: |
          chmod +x smoke_test.sh
          ./smoke_test.sh
