events {
    worker_connections 1024;
}

http {
    # --- Оптимизация производительности ---
    # Отключаем буферизацию для прокси (чтобы данные шли сразу клиенту)
    proxy_buffering off;
    proxy_request_buffering off;   # отключаем буферизацию тела запроса

    # Увеличиваем таймауты (для WebSocket и долгих запросов)
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Включаем keepalive для соединений с бекендом (снижаем задержки)
    upstream planka_backend {
        server planka:1337;
        keepalive 32;   # число открытых keepalive-соединений
    }

    # --- Формат логов (JSON) ---
    log_format json_combined escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"request_uri":"$request_uri",'
        '"request_method":"$request_method",'
        '"server_protocol":"$server_protocol"'
    '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        # --- Кэширование статики на 1 день (для CSS/JS/шрифтов) ---
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://planka_backend;
            proxy_cache_valid 200 1d;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            # Для статики тоже можно отключить буферизацию
            proxy_buffering off;
        }

        # --- Основной прокси для всех остальных запросов ---
        location / {
            proxy_pass http://planka_backend;

            # Обязательные заголовки для WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Стандартные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Снимаем ограничение на размер тела запроса (если нужно)
            client_max_body_size 10M;

            # Отключаем буферизацию для всех прокси-запросов
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
